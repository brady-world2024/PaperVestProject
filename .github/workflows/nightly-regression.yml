name: Nightly Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  pr-fast-lane:
    name: PR fast lane baseline
    uses: ./.github/workflows/pr-fast-lane.yml

  backend-real-infra-tests:
    name: Backend real-infrastructure integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pr-fast-lane
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: papervest
          POSTGRES_USER: papervest
          POSTGRES_PASSWORD: papervest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papervest -d papervest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Postgres and RabbitMQ integration tests
        run: >
          ./backend/mvnw -f backend/pom.xml -q
          -Dtest=PostgresIntegrationTest,ConditionalOrderMessagingIntegrationTest
          test

  local-ci-smoke:
    name: Local CI smoke verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - pr-fast-lane
      - backend-real-infra-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: papervest
          POSTGRES_USER: papervest
          POSTGRES_PASSWORD: papervest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papervest -d papervest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start backend with CI smoke profile
        run: |
          SPRING_PROFILES_ACTIVE=ci-smoke ./backend/mvnw -f backend/pom.xml -q spring-boot:run > backend-smoke.log 2>&1 &
          echo $! > backend-smoke.pid

      - name: Wait for backend health endpoint
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Backend never became healthy"
          cat backend-smoke.log
          exit 1

      - name: Run reusable smoke verification
        run: bash ./scripts/ci/smoke-api.sh http://localhost:8080

      - name: Upload backend smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backend-smoke-log
          path: backend-smoke.log

      - name: Stop backend
        if: always()
        run: |
          if [[ -f backend-smoke.pid ]]; then
            kill "$(cat backend-smoke.pid)" || true
          fi

  web-playwright-e2e:
    name: Web Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - pr-fast-lane
      - backend-real-infra-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: papervest
          POSTGRES_USER: papervest
          POSTGRES_PASSWORD: papervest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papervest -d papervest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @papervest/web exec playwright install --with-deps chromium

      - name: Start backend with CI smoke profile
        run: |
          APP_BOOTSTRAP_ADMIN_EMAILS=admin@example.com SPRING_PROFILES_ACTIVE=ci-smoke ./backend/mvnw -f backend/pom.xml -q spring-boot:run > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid

      - name: Wait for backend health endpoint
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Backend never became healthy"
          cat backend-e2e.log
          exit 1

      - name: Run Playwright web flows
        env:
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8080/api
          PLAYWRIGHT_ADMIN_EMAIL: admin@example.com
          PLAYWRIGHT_ADMIN_PASSWORD: SecurePass1
        run: pnpm --filter @papervest/web e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results

      - name: Upload backend E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backend-e2e-log
          path: backend-e2e.log

      - name: Stop backend
        if: always()
        run: |
          if [[ -f backend-e2e.pid ]]; then
            kill "$(cat backend-e2e.pid)" || true
          fi
