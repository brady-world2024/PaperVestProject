server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

spring:
  config:
    import:
      - optional:file:.env.development[.properties]
  application:
    name: PaperVest API
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:papervest}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:papervest}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:papervest}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        auto-startup: ${SPRING_RABBITMQ_LISTENER_AUTO_STARTUP:true}
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
        add-additional-paths: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADDITIONAL_PATHS:true}
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
      show-components: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS:never}
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace,ping,marketDataConfiguration,conditionalOrdersRuntime

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.papervest: ${LOGGING_LEVEL_PAPERVEST:INFO}

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:replace-me-with-at-least-32-characters}
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:P30D}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
    auth-cookie:
      access-token-name: ${APP_AUTH_COOKIE_ACCESS_NAME:papervest_access}
      refresh-token-name: ${APP_AUTH_COOKIE_REFRESH_NAME:papervest_refresh}
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      access-token-path: ${APP_AUTH_COOKIE_ACCESS_PATH:/api}
      refresh-token-path: ${APP_AUTH_COOKIE_REFRESH_PATH:/api/auth}
    auth-rate-limit:
      enabled: ${APP_AUTH_RATE_LIMIT_ENABLED:true}
      window: ${APP_AUTH_RATE_LIMIT_WINDOW:PT10M}
      login-max-attempts: ${APP_AUTH_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:10}
      register-max-attempts: ${APP_AUTH_RATE_LIMIT_REGISTER_MAX_ATTEMPTS:5}
      password-reset-request-max-attempts: ${APP_AUTH_RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX_ATTEMPTS:5}
      password-reset-confirm-max-attempts: ${APP_AUTH_RATE_LIMIT_PASSWORD_RESET_CONFIRM_MAX_ATTEMPTS:10}
      email-verification-confirm-max-attempts: ${APP_AUTH_RATE_LIMIT_EMAIL_VERIFICATION_CONFIRM_MAX_ATTEMPTS:10}
  portfolio:
    initial-cash: ${APP_INITIAL_CASH:100000.00}
  account-lifecycle:
    web-base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
    email-verification-token-ttl: ${APP_EMAIL_VERIFICATION_TOKEN_TTL:P2D}
    password-reset-token-ttl: ${APP_PASSWORD_RESET_TOKEN_TTL:PT1H}
  market-data:
    provider: ${MARKETDATA_PROVIDER:FINNHUB}
    request-timeout: ${MARKETDATA_REQUEST_TIMEOUT:PT4S}
    quote-cache-ttl: ${MARKETDATA_QUOTE_CACHE_TTL:PT30S}
    quote-stale-grace-ttl: ${MARKETDATA_QUOTE_STALE_GRACE_TTL:PT15M}
    history-cache-ttl: ${MARKETDATA_HISTORY_CACHE_TTL:PT5M}
    history-stale-grace-ttl: ${MARKETDATA_HISTORY_STALE_GRACE_TTL:P1D}
    search-cache-ttl: ${MARKETDATA_SEARCH_CACHE_TTL:PT5M}
    search-stale-grace-ttl: ${MARKETDATA_SEARCH_STALE_GRACE_TTL:PT30M}
    allow-partial-home-results: ${MARKETDATA_ALLOW_PARTIAL_HOME_RESULTS:true}
    home-symbols:
      - symbol: AAPL
        company-name: Apple
      - symbol: MSFT
        company-name: Microsoft
      - symbol: NVDA
        company-name: NVIDIA
      - symbol: AMZN
        company-name: Amazon
      - symbol: META
        company-name: Meta
      - symbol: TSLA
        company-name: Tesla
    finnhub:
      base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
      api-key: ${FINNHUB_API_KEY:demo}
  conditional-orders:
    scheduler:
      enabled: ${APP_CONDITIONAL_ORDERS_SCHEDULER_ENABLED:true}
      batch-size: ${APP_CONDITIONAL_ORDERS_BATCH_SIZE:100}
      fixed-delay-ms: ${APP_CONDITIONAL_ORDERS_FIXED_DELAY_MS:10000}
    messaging:
      exchange: ${APP_CONDITIONAL_ORDERS_EXCHANGE:conditional-orders.exchange}
      queue: ${APP_CONDITIONAL_ORDERS_QUEUE:conditional-orders.execute}
      routing-key: ${APP_CONDITIONAL_ORDERS_ROUTING_KEY:conditional-orders.execute}
      listener-enabled: ${APP_CONDITIONAL_ORDERS_LISTENER_ENABLED:true}
